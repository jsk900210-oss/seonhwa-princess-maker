name: Deploy public tester build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use the pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Run game asset and scene quality gate
        run: node tools/run_quality_gate.mjs
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: output/quality-gate-report.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed revision and critical market asset
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          expected_revision=$(node -e "const fs=require('fs');const s=fs.readFileSync('src/app.js','utf8');process.stdout.write(s.match(/const scheduleAssetRevision='([^']+)'/)[1])")
          target="$PAGE_URL/src/index.html?deploy=$EXPECTED_SHA"
          for attempt in {1..24}; do
            page=$(curl --fail --silent --show-error "$target" || true)
            if printf '%s' "$page" | grep -Fq "app.js?v=$expected_revision"; then
              curl --fail --silent --show-error "$PAGE_URL/assets/backgrounds/market/market-three-shops-v1.png?deploy=$EXPECTED_SHA" >/dev/null
              echo "Verified Pages revision $expected_revision and generated market background."
              exit 0
            fi
            sleep 5
          done
          echo "Pages did not serve revision $expected_revision after deployment." >&2
          exit 1
