<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>선화공주 만들기 — 자산 로딩 테스트</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="schedule.css?v=0.61.14-debug">
  <link rel="stylesheet" href="birthday.css">
  <link rel="stylesheet" href="prologue.css">
  <link rel="stylesheet" href="rain-v2.css">
  <link rel="stylesheet" href="naming.css">
  <link rel="stylesheet" href="live-changes.css?v=0.61.14-debug">
  <link rel="stylesheet" href="collection.css?v=0.61.15-debug">
  <style>.prologue:not(.outdoor-rain) .rain{display:none}</style>
</head>
<body>
  <main class="phone" aria-label="모바일 게임 테스트 화면">
    <section class="prologue" id="prologue" aria-label="이야기 시작 영상">
      <audio id="prologueMusic" src="../assets/audio/music/prologue-lantern-and-dawn.mp3" preload="auto" loop></audio>
      <img id="prologueImage" src="../assets/cinematics/prologue/01-rainy-road.webp" alt="비 오는 밤길">
      <div class="rain" aria-hidden="true"></div>
      <div class="prologue-copy"><small id="prologueChapter">서장 · 비 오는 밤</small><p id="prologueText"></p><div class="prologue-progress" id="prologueProgress"></div></div>
      <button class="prologue-skip" id="prologueSkip">건너뛰기</button>
      <button class="prologue-sound" id="prologueSound" aria-pressed="false">소리 켜기</button>
      <button class="prologue-back" id="prologueBack" disabled>뒤로</button>
      <button class="prologue-next" id="prologueNext">다음</button>
    </section>
    <section class="birthday-setup" id="birthdaySetup" aria-labelledby="birthdayTitle">
      <div class="birthday-card">
        <span class="setup-emblem">名</span>
        <h1 id="birthdayTitle">아이와 유모의 이름</h1>
        <p>앞으로 불릴 이름을 직접 지어주세요.<br>이름과 생일을 정하면 성장 이야기가 시작됩니다.</p>
        <label for="characterNameInput">아이 이름</label>
        <input id="characterNameInput" type="text" maxlength="10" placeholder="아이의 이름" autocomplete="off">
        <label for="nannyNameInput">유모 이름</label>
        <input id="nannyNameInput" type="text" maxlength="10" placeholder="유모의 이름" autocomplete="off">
        <label for="birthdayInput">생년월일</label>
        <input id="birthdayInput" type="date" min="1990-01-01" max="1990-12-31" value="1990-01-01">
        <small>선택 가능 기간 · 1990년 1월 1일~12월 31일</small>
        <button id="startGame">이 생일로 시작</button><button class="story-replay" id="storyReplay">프롤로그 다시 보기</button>
      </div>
    </section>
    <img class="background" src="../assets/backgrounds/home/home-room-morning.webp" alt="한옥 안채">
    <header><span id="dateLabel">9세 · 3월</span><strong id="moneyLabel">1,200냥</strong><button class="menu-button" id="saveMenu" aria-label="저장 메뉴">☰</button></header>
    <section class="live-changes" id="liveChanges" aria-label="실시간 능력치 변화" aria-live="polite"></section>
    <section class="character-slot" id="characterSlot">
      <img id="character" src="../assets/characters/seonhwa/age-09/base/seonhwa-age09-base.png" alt="9세 선화">
      <div class="missing" id="missing">기준 캐릭터 원본 재첨부 대기</div>
    </section>
    <section class="dialogue"><b id="speakerName">유모</b><p id="dialogueText">아이야, 오늘은 무엇을 해볼까?</p></section>
    <section class="home-greeting" id="homeGreeting" hidden aria-live="polite">
      <b id="homeGreetingSpeaker"></b><p id="homeGreetingLine"></p><b id="homeGreetingPrompt"></b><div id="homeGreetingChoices"></div>
    </section>
    <aside class="expression-preview" id="expressionPreview" hidden><img id="expressionImage" alt="선화 표정"><span id="expressionLabel"></span></aside>
    <section class="activity-playback" id="activityPlayback" hidden aria-live="polite"><b id="playbackDay"></b><span id="playbackAction"></span><div><i id="playbackProgress"></i></div></section>
    <section class="vacation-scene" id="vacationScene" hidden aria-live="polite">
      <img id="vacationImage" alt="바캉스 추억 일러스트">
      <div class="vacation-vignette" aria-hidden="true"></div>
      <div class="encounter-character" id="encounterCharacter" hidden><img src="../assets/characters/npcs/activity/dolsoe-1.png" alt="여행길에서 만난 또래"></div>
      <div class="encounter-dialogue" id="encounterDialogue" hidden><b id="encounterName">낯선 또래</b><p id="encounterText"></p></div>
      <div class="vacation-title" id="vacationTitle"></div>
      <button class="vacation-next" id="vacationNext" type="button">화면을 터치해 계속</button>
    </section>
    <section class="activity-stage" id="activityStage" hidden aria-label="일정 수행 장면">
      <div class="stage-roof" aria-hidden="true"></div>
      <div class="stage-inner">
        <img class="stage-map" id="stageMap" src="../assets/backgrounds/home/home-room-morning.webp" alt="활동 장소">
        <div class="stage-map-shade" aria-hidden="true"></div>
        <div class="condition-cue" id="conditionCue" hidden aria-live="polite"></div>
        <div class="market-explore" id="marketExplore" hidden>
          <button class="market-shop tavern" data-market-shop="food" aria-label="왼쪽 인물 선택"><img src="../assets/characters/npcs/shops/tavern-hostess.png" alt="주모"></button>
          <button class="market-shop hanbok" data-market-shop="outfit" aria-label="오른쪽 인물 선택"><img src="../assets/characters/npcs/shops/hanbok-owner.png" alt="한복점 주인"></button>
          <div class="market-confirm" id="marketConfirm" hidden role="dialog" aria-modal="true" aria-labelledby="marketConfirmText"><p id="marketConfirmText"></p><div><button id="marketConfirmNo" type="button">아니요</button><button id="marketConfirmYes" type="button">네</button></div></div>
          <div class="market-controls"><button id="marketEnter" disabled>다음</button></div>
        </div>
        <div class="stage-props" id="stageProps" aria-hidden="true"></div>
        <div class="stage-npc" id="stageNpc"><img id="stageNpcImage" alt="활동을 함께하는 마을 사람"></div>
        <div class="stage-character pixel-sprite" id="stageCharacter"><img id="stageCharacterImage" src="../assets/characters/seonhwa/age-09/sprites/walk/seonhwa-walk-down-2.png" alt="일정을 수행하는 선화"></div>
      </div>
      <div class="stage-caption" id="stageCaption"></div>
      <div class="activity-gauges" id="activityGauges" hidden aria-label="이번 활동의 능력치 변화"></div>
      <div class="day-result" id="dayResult" hidden></div>
    </section>
    <nav><button data-panel="schedule">일정</button><button data-panel="status">상태</button><button data-panel="inventory">소지품</button><button data-panel="collection">수집도감</button><button id="marketFinish" type="button">집으로 돌아가기</button></nav>
    <section class="panel" id="panel" hidden aria-live="polite">
      <div class="panel-head"><h2 id="panelTitle"></h2><button id="closePanel" aria-label="닫기">×</button></div>
      <div id="panelBody"></div>
    </section>
  </main>
  <script src="story-data.js?v=0.61.18-debug"></script><script src="app.js?v=0.61.18-debug"></script>
</body>
</html>
