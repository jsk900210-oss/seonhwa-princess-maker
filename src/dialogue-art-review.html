<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선화 대화 표정 검수</title>
<style>body{background:#241c17;color:#fff2d8;font-family:system-ui;margin:20px}main{display:flex;gap:16px;flex-wrap:wrap}.scene{width:260px;height:460px;position:relative;overflow:hidden;background:url('../assets/backgrounds/home/home-room-morning.webp') center/cover}.scene img{position:absolute;left:0;bottom:0;width:100%;mask-image:linear-gradient(#000 90%,transparent)}.scene p{position:absolute;left:10px;right:10px;top:0;margin:10px 0;padding:12px;background:#fff4df;color:#3c2b21;border-radius:10px;font-size:13px}a{color:#ffd792}</style>
<h1>9~12세 대화 표정 검수</h1><p>게임 저장에 영향을 주지 않는 검수 전용 화면. 실제 이벤트 연결 전입니다.</p><main id="review"></main><a href="./?v=home-skin-v3">전체 게임</a>
<script>const emotions={neutral:'기본',happy:'기쁨',worried:'걱정',sad:'슬픔',displeased:'불만',surprised:'놀람',shy:'수줍음'};for(const [key,label] of Object.entries(emotions)){const article=document.createElement('article');article.innerHTML=`<h2>${label}</h2><div class="scene"><img alt="${label}" src="../assets/characters/seonhwa/dialogue/age-09-12/${key}-v1.png"><p>선화 · ${label}<br>표정과 얼굴 위치를 확인해주세요.</p></div>`;document.querySelector('#review').append(article)}</script></html>
